name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install LaTeX for CV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern poppler-utils

      - name: Compile CV PDF from current LaTeX source
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=cv cv/cv.tex
          cp cv/cv.pdf public/files/cv.pdf
          pdftotext -layout public/files/cv.pdf cv/cv_extracted.txt
          python -c 'from pathlib import Path; content=" ".join(Path("cv/cv_extracted.txt").read_text().split()); assert "Equilibrium Price Effects of Household Stock Selection" in content; assert "The Intensive and Extensive Margins of Arbitrage" in content'

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
